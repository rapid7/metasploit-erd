name: Verify

# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#permissions
permissions:
  actions: none
  checks: none
  contents: none
  deployments: none
  id-token: none
  issues: none
  discussions: none
  packages: none
  pages: none
  pull-requests: none
  repository-projects: none
  security-events: none
  statuses: none

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  build:
    uses: dwelch-r7/metasploit-framework/.github/workflows/shared_gem_verify_rails.yml@rails-8-gem-ci-test
    with:
      additional_rails_versions: '["~> 8.0.0"]'
      dependencies: '["libpcap-dev", "graphviz"]'
      test_commands: |
        bundle exec rake spec
        bundle exec rake yard
